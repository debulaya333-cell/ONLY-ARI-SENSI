name: Build ONLY ARI SENSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '6.5'

      - name: Extract Android Project
        run: unzip -q OnlyAriSensiNative.zip

      - name: Build APK
        working-directory: OnlyAriSensiNative
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ONLY-ARI-SENSI-APK
          path: OnlyAriSensiNative/app/build/outputs/apk/debug/app-debug.apk
